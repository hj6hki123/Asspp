name: Build App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OTA manifest metadata
        shell: pwsh
        run: ./Resources/Scripts/verify.ota.manifest.ps1

      - name: Select Xcode
        run: |
          set -euo pipefail
          for XCODE_APP in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode.app
          do
            if [ -d "${XCODE_APP}" ]; then
              sudo xcode-select -s "${XCODE_APP}"
              if xcodebuild -showsdks 2>/dev/null | grep -q "iphoneos"; then
                echo "Selected: ${XCODE_APP}"
                xcodebuild -version
                xcodebuild -showsdks | grep iphoneos
                exit 0
              fi
            fi
          done

          echo "No Xcode installation with an iPhoneOS SDK was found."
          exit 1

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Build
        run: |
          chmod +x Resources/Scripts/compile.release.mobile.ci.sh
          ./Resources/Scripts/compile.release.mobile.ci.sh "$(pwd)" "$(pwd)/Asspp.ipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asspp.ipa
          path: Asspp.ipa

  build-osx:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OTA manifest metadata
        shell: pwsh
        run: ./Resources/Scripts/verify.ota.manifest.ps1

      - name: Select Xcode
        run: |
          set -euo pipefail
          for XCODE_APP in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode.app
          do
            if [ -d "${XCODE_APP}" ]; then
              sudo xcode-select -s "${XCODE_APP}"
              echo "Selected: ${XCODE_APP}"
              xcodebuild -version
              exit 0
            fi
          done

          echo "No Xcode installation was found."
          exit 1

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Build
        run: |
          chmod +x Resources/Scripts/compile.release.osx.sh
          ./Resources/Scripts/compile.release.osx.sh "$(pwd)" "$(pwd)/Asspp.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asspp.zip
          path: Asspp.zip
